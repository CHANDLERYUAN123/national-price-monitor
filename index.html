<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>民生价格变化图表</title>
<style>
body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:24px;color:#172033;background:#fff}
h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:0}
h2{font-size:20px;margin:28px 0 12px;letter-spacing:0}
.subtitle,.updated{margin:0;color:#536070;font-size:15px}
.updated{margin-top:8px;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:10px 0 14px}
label{display:grid;gap:6px;font-size:14px;font-weight:700}
select{min-width:172px;max-width:100%;padding:8px;border:1px solid #9aa6b2;border-radius:4px;background:#fff;color:#172033}
.chart-wrap{border:1px solid #d7dde5;overflow:auto;max-width:100%;position:relative}
#trend{display:block;min-width:980px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid #e7ebf0;padding:9px;text-align:left;vertical-align:top}
th{background:#f7f9fb}
.grid{stroke:#e7ebf0;stroke-width:1}
.axis{stroke:#98a2b3;stroke-width:1}
.empty{color:#667085;text-align:center;padding:48px 12px}
a{color:#175cd3}
footer{margin-top:28px;padding-top:16px;border-top:1px solid #d7dde5;color:#475467;font-size:14px}
@media(max-width:760px){body{margin:14px}select{min-width:145px}}
</style>
</head>
<body>
<header>
<h1>民生价格变化图表</h1>
<p class="subtitle">全国60+重点省市数据持续扩展更新中</p>
<p class="updated">数据更新时间：2026-09-11 17:34:47</p>
</header>
<section>
<h2>地区价格折线图</h2>
<div class="controls">
<label>省/直辖市/自治区<select id="province"></select></label>
<label>地区<select id="region"></select></label>
<label>商品<select id="item"></select></label>
<label>规格<select id="spec"></select></label>
</div>
<div class="chart-wrap"><svg id="trend" height="390" viewBox="0 0 980 390" role="img" aria-label="地区价格折线图"></svg></div>
</section>
<section>
<h2>数据来源</h2>
<table><thead><tr><th>日期与期次</th><th>商品与规格</th><th>价格</th><th>官方环比</th><th>口径</th><th>官方链接</th></tr></thead><tbody id="tbody"></tbody></table>
</section>
<footer>问题反馈：<a href="mailto:chandleryuan123@gmail.com">chandleryuan123@gmail.com</a></footer>
<script>
let data=[];
async function loadData(){
  try{
    const manifest=await fetch("data/数据索引.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("数据索引读取失败");return r.json();});
    const groups=await Promise.all(manifest.网页数据分片.map(p=>fetch(p.文件,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("数据分片读取失败");return r.json();})));
    data=groups.flat();
    setDefaults();render();
  }catch(error){console.error(error);render();}
}
const byId=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));
const pinyinCollator=new Intl.Collator("zh-CN-u-co-pinyin",{usage:"sort",sensitivity:"base"});
const sortCn=(a,b)=>pinyinCollator.compare(String(a??""),String(b??""));
const unique=items=>[...new Set(items.filter(Boolean))].sort(sortCn);
function fill(sel, values, current){sel.innerHTML=values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(current&&values.includes(current))sel.value=current;}
function regionValues(province){const vals=unique(data.filter(r=>r.省级===province).map(r=>r.地区));return vals.sort((a,b)=>a===province?-1:b===province?1:sortCn(a,b));}
function setDefaults(){fill(byId("province"),unique(data.map(r=>r.省级)),"北京市");fill(byId("region"),regionValues(byId("province").value),"北京市");fill(byId("item"),unique(data.filter(r=>r.省级===byId("province").value&&r.地区===byId("region").value).map(r=>r.商品)),"农产品批发价格指数");fill(byId("spec"),unique(data.filter(r=>r.省级===byId("province").value&&r.地区===byId("region").value&&r.商品===byId("item").value).map(r=>r.规格)),"综合指数");}
function sync(changed){if(changed==="province")fill(byId("region"),regionValues(byId("province").value));if(changed==="province"||changed==="region")fill(byId("item"),unique(data.filter(r=>r.省级===byId("province").value&&r.地区===byId("region").value).map(r=>r.商品)),byId("item").value);if(changed!=="spec")fill(byId("spec"),unique(data.filter(r=>r.省级===byId("province").value&&r.地区===byId("region").value&&r.商品===byId("item").value).map(r=>r.规格)),byId("spec").value);render();}
function rowsForSelection(){return data.filter(r=>r.省级===byId("province").value&&r.地区===byId("region").value&&r.商品===byId("item").value&&r.规格===byId("spec").value).sort((a,b)=>a.日期.localeCompare(b.日期));}
function table(rows){byId("tbody").innerHTML=rows.slice().reverse().map(r=>`<tr><td>${esc(r.日期)}<br>${esc(r.期次)}</td><td>${esc(r.商品)}<br>${esc(r.规格)}</td><td>${esc(r.价格)} ${esc(r.单位)}</td><td>${esc(r.官方环比)}</td><td>${esc(r.口径)}</td><td><a href="${esc(r.来源链接)}" target="_blank" rel="noopener">官方链接</a></td></tr>`).join("")||`<tr><td colspan="6" class="empty">暂无匹配数据</td></tr>`;}
function ticks(min,max){const span=max-min||1,raw=span/5,pow=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/pow,step=(n<=1?1:n<=2?2:n<=5?5:10)*pow,start=Math.floor(min/step)*step,end=Math.ceil(max/step)*step,out=[];for(let v=start;v<=end+step/2;v+=step)out.push(Number(v.toFixed(6)));return{start,end,out};}
function chartRows(rows){const byDate=new Map();rows.forEach(r=>{const p=Number(r.价格);if(Number.isFinite(p)&&!byDate.has(r.日期))byDate.set(r.日期,{日期:r.日期,价格:p,单位:r.单位});});return [...byDate.values()].sort((a,b)=>a.日期.localeCompare(b.日期));}
function draw(rows){const svg=byId("trend"),w=980,h=390,left=62,right=24,top=24,bottom=86;svg.innerHTML="";const pts=chartRows(rows);if(!pts.length){svg.innerHTML=`<text x="${w/2}" y="${h/2}" text-anchor="middle" class="empty">暂无可绘制价格</text>`;return;}const min=Math.min(...pts.map(p=>p.价格)),max=Math.max(...pts.map(p=>p.价格)),sc=ticks(min,max),y=v=>top+(sc.end-v)/(sc.end-sc.start||1)*(h-top-bottom),x=i=>left+(w-left-right)*(pts.length===1?0.5:i/(pts.length-1));sc.out.forEach(v=>{const yy=y(v);svg.innerHTML+=`<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" class="grid"/><text x="8" y="${yy+4}" font-size="12">${v.toFixed(2)}</text>`;});svg.innerHTML+=`<line x1="${left}" y1="${h-bottom}" x2="${w-right}" y2="${h-bottom}" class="axis"/><line x1="${left}" y1="${top}" x2="${left}" y2="${h-bottom}" class="axis"/>`;svg.innerHTML+=`<path d="${pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.价格).toFixed(1)}`).join(" ")}" fill="none" stroke="#175cd3" stroke-width="2.5"/>`;const dense=pts.length>30,labelStep=dense?Math.max(1,Math.ceil((pts.length-1)/11)):1;pts.forEach((p,i)=>{const xx=x(i),yy=y(p.价格);svg.innerHTML+=`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="3" fill="#175cd3"><title>${esc(p.日期)} ${p.价格} ${esc(p.单位)}</title></circle>`;if(!dense)svg.innerHTML+=`<text x="${xx.toFixed(1)}" y="${Math.max(12,yy-8).toFixed(1)}" font-size="11" text-anchor="middle" fill="#175cd3">${p.价格}</text>`;if(!dense||i%labelStep===0||i===pts.length-1)svg.innerHTML+=`<text transform="translate(${xx.toFixed(1)},${h-64}) rotate(-55)" font-size="11" text-anchor="end" fill="#526274">${esc(p.日期)}</text>`;});}
function render(){const rows=rowsForSelection();draw(rows);table(rows);}
loadData();["province","region","item","spec"].forEach(id=>byId(id).addEventListener("change",()=>sync(id)));
</script>
</body>
</html>
